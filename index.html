<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4ef">
    <title>Pokédex | Pokémon Explorer</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.cdnfonts.com/css/pokemon-solid" rel="stylesheet">
    <link rel="icon" href="images/icon_pokeball.png" type="image/png">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Pokédex home">
        <img src="images/logo_pokemon.png" alt="Pokémon">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-label">POKÉDEX</span>
      </a>
      <button id="language-toggle" class="button button-primary" type="button" aria-label="Switch page language to French">FR</button>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title" data-i18n="pageTitle">Find a Pokémon.</h1>
        <p class="intro-copy" data-i18n="introCopy">Search by name or Pokédex number, or explore the original Kanto roster.</p>
      </section>

      <section class="search-panel" aria-label="Find a Pokémon" data-i18n-aria-label="searchSection">
        <form id="search-form">
          <label for="search-input" data-i18n="searchLabel">Search Pokémon</label>
          <div class="search-controls">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input type="search" id="search-input" placeholder="Try Pikachu or 25" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
            <button type="submit" id="search-button"><span data-i18n="searchButton">Search</span> <span aria-hidden="true">→</span></button>
          </div>
        </form>
        <p class="search-hint" data-i18n="searchHint">Search by Pokémon name or Pokédex number</p>
      </section>

      <p id="search-feedback" role="status" aria-live="polite"></p>

      <section id="search-result" class="search-result hidden" aria-labelledby="search-result-title">
        <div class="section-heading">
          <div>
            <h2 id="search-result-title" data-i18n="pokemonDetails">Pokémon details</h2>
          </div>
        </div>
        <div id="search-pokemon-container" class="pokemon-grid"></div>
      </section>

      <section class="explorer" aria-labelledby="explorer-title">
        <div class="section-heading">
          <div>
            <h2 id="explorer-title" data-i18n="kantoPokemon">Kanto Pokémon</h2>
            <p class="section-copy" data-i18n="sectionCopy">Meet the first 150 Pokémon and their types.</p>
          </div>
          <div class="section-actions">
            <button id="generate-pokemon" class="button button-primary" type="button">
              <span aria-hidden="true">＋</span><span data-i18n="exploreButton">Explore Pokémon</span>
            </button>
            <button id="delete-btn" class="button button-quiet" type="button" data-i18n="clearButton">Clear list</button>
          </div>
        </div>
        <div id="container">
          <div id="poke-container" class="pokemon-grid"></div>
        </div>
      </section>
    </main>

    <footer id="signature"><span data-i18n="madeBy">Made by</span> Sanitikhan · 2024</footer>
    <footer id="design" data-i18n="redesigned">Redesigned on 2026</footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
